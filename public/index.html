<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apex Circuit 3D - Racing Game</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #1a1a2e;
            color: #eee;
            overflow: hidden;
        }

        #canvas { display: block; width: 100%; height: 100vh; }

        #hud {
            position: absolute; top: 20px; left: 20px;
            color: #00ff88; font-size: 14px; font-family: 'Courier New', monospace;
            z-index: 100; text-shadow: 0 0 10px rgba(0, 255, 136, 0.5);
            pointer-events: none; line-height: 1.6;
        }

        #speedometer {
            position: absolute; bottom: 30px; left: 30px;
            color: #00ff88; font-size: 22px; font-weight: bold;
            text-shadow: 0 0 10px rgba(0, 255, 136, 0.5);
            z-index: 100; pointer-events: none;
        }

        #carSelector {
            position: absolute; top: 20px; right: 20px;
            background: rgba(26, 26, 46, 0.95);
            border: 2px solid #00ff88; padding: 15px; border-radius: 5px;
            width: 290px; z-index: 100; max-height: 70vh; overflow-y: auto;
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.3);
        }

        .car-button {
            display: block; width: 100%; padding: 8px 10px; margin: 5px 0;
            background: rgba(0, 255, 136, 0.1); border: 1px solid #00ff88;
            color: #00ff88; cursor: pointer; border-radius: 3px;
            transition: all 0.2s; text-align: left; font-size: 12px;
        }

        .car-button:hover { background: rgba(0, 255, 136, 0.3); }
        .car-button.selected {
            background: rgba(0, 255, 136, 0.4); font-weight: bold;
            box-shadow: 0 0 10px rgba(0, 255, 136, 0.8);
        }
        .car-button.locked { border-color: #f59e0b; color: #f59e0b; background: rgba(245, 158, 11, 0.08); }

        #wallet {
            position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
            color: #f59e0b; font-size: 16px; font-weight: bold;
            z-index: 100; text-shadow: 0 0 10px rgba(245, 158, 11, 0.6);
            pointer-events: none;
        }

        #mapSelector {
            position: absolute; bottom: 30px; right: 30px;
            background: rgba(26, 26, 46, 0.95);
            border: 2px solid #00ff88; padding: 15px; border-radius: 5px;
            z-index: 100; box-shadow: 0 0 20px rgba(0, 255, 136, 0.3);
        }

        .map-button {
            display: inline-block; padding: 8px 15px; margin: 5px;
            background: rgba(0, 255, 136, 0.1); border: 1px solid #00ff88;
            color: #00ff88; cursor: pointer; border-radius: 3px;
            transition: all 0.2s; font-size: 12px;
        }
        .map-button:hover { background: rgba(0, 255, 136, 0.3); }
        .map-button.active {
            background: rgba(0, 255, 136, 0.4); font-weight: bold;
            box-shadow: 0 0 10px rgba(0, 255, 136, 0.8);
        }

        #loading {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(26, 26, 46, 0.98); padding: 30px 40px; border-radius: 10px;
            color: #00ff88; text-align: center; z-index: 200; display: none;
            box-shadow: 0 0 30px rgba(0, 255, 136, 0.5);
        }
        #loading.active { display: block; }

        .loading-spinner {
            border: 3px solid rgba(0, 255, 136, 0.3); border-top: 3px solid #00ff88;
            border-radius: 50%; width: 40px; height: 40px;
            animation: spin 1s linear infinite; margin: 15px auto;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        #help { position: absolute; bottom: 100px; left: 30px; color: #94a3b8; font-size: 12px; z-index: 100; pointer-events: none; }
    
        #nitroBar { position:absolute; bottom:70px; left:30px; width:220px; height:10px; border:1px solid #f97316; border-radius:5px; z-index:100; overflow:hidden; pointer-events:none; }
        #nitroFill { height:100%; width:100%; background:linear-gradient(90deg,#f97316,#fde047); transition:width .1s; }
        #toast { position:absolute; top:70px; left:50%; transform:translateX(-50%); background:rgba(26,26,46,.95); border:1px solid #f59e0b; color:#f59e0b; padding:8px 16px; border-radius:5px; z-index:150; opacity:0; transition:opacity .3s; pointer-events:none; }
        #toast.show { opacity:1; }
</style>
</head>
<body>
    <canvas id="canvas"></canvas>

    <div id="loading">
        <div class="loading-spinner"></div>
        <p id="loadingText">Carregando...</p>
    </div>

    <div id="hud">
        <div>Mapa: <span id="currentMap">...</span></div>
        <div>Carro: <span id="currentCar">...</span></div>
        <div>FPS: <span id="fps">0</span></div>
    </div>

    <div id="wallet">💰 <span id="walletCoins">0</span></div>
    <div id="speedometer">Velocidade: <span id="speedValue">0</span> km/h</div>
    <div id="nitroBar"><div id="nitroFill"></div></div>
    <div id="toast"></div>
    <div id="help">WASD/Setas = dirigir &nbsp;|&nbsp; Shift = nitro &nbsp;|&nbsp; Espaço = freio de mão (drift) &nbsp;|&nbsp; C = câmera</div>

    <div id="carSelector">
        <strong style="display:block;margin-bottom:10px;color:#00ff88;">🚗 GARAGEM</strong>
        <div id="carList"></div>
    </div>

    <div id="mapSelector">
        <strong style="display:block;margin-bottom:10px;color:#00ff88;">🗺️ MAPAS</strong>
        <button class="map-button active" data-map="city">Cidade</button>
        <button class="map-button" data-map="desert">Deserto</button>
        <button class="map-button" data-map="night">Pista Noturna</button>
    </div>

    <!-- Import Maps: Three.js r167 (versao moderna com WebGL2/sRGB correto) -->
    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.167.1/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.167.1/examples/jsm/"
        }
    }
    </script>

    <script type="module" src="./game.js"></script>
</body>
</html>
